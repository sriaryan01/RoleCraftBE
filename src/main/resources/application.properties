spring.application.name=resume-tailor-backend
server.port=${PORT:8082}

# Load local development secrets whether the app is launched from backend/, the
# repository root, or this workspace's parent folder. Deployment environment
# variables still take precedence.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:resume-tailor-app/backend/.env[.properties]

# The real key is stored locally in .env / environment variables.
# Do not commit the actual key to Git.
ai.provider=${AI_PROVIDER:groq}
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.6-flash
groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_API_MODEL:openai/gpt-oss-120b}

# Allow uploads up to 8MB
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Comma-separated frontend origins. Override with APP_CORS_ALLOWED_ORIGINS on Render.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,https://rolecraft-sriaryan.vercel.app}
