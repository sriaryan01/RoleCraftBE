spring.application.name=resume-tailor-backend
server.port=8082

# The real key is stored locally in .env / environment variables.
# Do not commit the actual key to Git.
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-2.5-flash

# Allow uploads up to 8MB
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# React dev server origin allowed to call the API
app.cors.allowed-origin=http://localhost:5173
